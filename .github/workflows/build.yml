name: Build GlyphLens APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка APK
        run: gradle assembleDebug --no-daemon

      - name: Переименование файла в GlyphLens.apk
        run: cp app/build/outputs/apk/debug/*.apk GlyphLens.apk

      - name: Выгрузка готового GlyphLens.apk в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: GlyphLens
          path: GlyphLens.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glyphlens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.glyphlens.app"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.8.1"
        setProperty("archivesBaseName", "GlyphLens")
    }

    signingConfigs {
        debug {
            storeFile file('glyphlens.jks')
            storePassword 'glyphlens'
            keyAlias 'glyphlens'
            keyPassword 'glyphlens'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Чистый Android SDK без мусора
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glyphlens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.glyphlens.app"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.6"
        setProperty("archivesBaseName", "GlyphLens")
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Чистый Android SDK без стороннего рекламного мусора
}
